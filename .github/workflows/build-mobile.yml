name: 🚀 黑湾代驾MAX 手机司机端双端构建 (Android APK & iOS IPA) # Trigger: 2026-08-28

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ==========================================
  # 任务 1: 打包 手机端（司机）Android APK
  # ==========================================
  build-android:
    name: 🤖 打包 手机端（司机）Android APK
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Generate Mobile Assets & Icons
        run: |
          python3 scripts/generate_mobile_assets.py || node scripts/generate-icons.js || true

      - name: Capacitor Sync Android
        run: |
          npx cap sync android

      - name: Fix Gradle Wrapper Jar
        run: |
          cd android
          gradle wrapper --gradle-version 8.7 --distribution-type all

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../黑湾代驾MAX-手机司机端-Android-v2.0.apk

      - name: Upload Driver APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeiWan-Driver-Android-v2.0-APK
          path: 黑湾代驾MAX-手机司机端-Android-v2.0.apk
          retention-days: 14
          compression-level: 6
          overwrite: true

  # ==========================================
  # 任务 2: 打包 手机端（司机）苹果 iOS IPA
  # ==========================================
  build-ios:
    name: 🍏 打包 手机端（司机）iOS IPA 应用
    runs-on: macos-14
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install Dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Generate Mobile Assets & Icons
        run: |
          python3 scripts/generate_mobile_assets.py

      - name: Capacitor Sync iOS
        run: |
          npx cap sync ios
          python3 scripts/generate_mobile_assets.py

      - name: Build iOS App & Generate IPA
        run: |
          cd ios/App
          # Resolve SPM package dependencies
          xcodebuild -resolvePackageDependencies -project App.xcodeproj

          # Build App bundle without codesigning
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            ASSETCATALOG_COMPILER_APPICON_NAME="AppIcon" \
            ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
            ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOLS=NO \
            BUILD_DIR=../../build

          # Package .app bundle into standard full native .ipa (Payload archive)
          cd ../..
          mkdir -p Payload
          APP_PATH=$(find build -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app not found in build directory"
            exit 1
          fi
          echo "Found app at $APP_PATH"
          cp -r "$APP_PATH" Payload/

          # Include full native frameworks and Swift standard libraries if present
          SWIFT_DYLIBS=$(find build -name "*.dylib" -o -name "*.framework" | grep -v "App.app" || true)
          if [ -n "$SWIFT_DYLIBS" ]; then
            mkdir -p Payload/App.app/Frameworks
            find build -maxdepth 4 \( -name "*.framework" -o -name "*.dylib" \) -exec cp -r {} Payload/App.app/Frameworks/ \; || true
          fi

          zip -r "黑湾代驾MAX-手机司机端-iOS-v2.0.ipa" Payload
          rm -rf Payload

      - name: Upload Driver iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeiWan-Driver-iOS-v2.0-IPA
          path: 黑湾代驾MAX-手机司机端-iOS-v2.0.ipa
          retention-days: 14
          compression-level: 6
          overwrite: true




