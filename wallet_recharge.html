<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黑湾代驾MAX · 钱包充值</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { font-family:-apple-system, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; color:#fff; max-width:430px; margin:0 auto;
    background:
      radial-gradient(90% 30% at 88% -4%, rgba(255,122,26,.26) 0%, rgba(255,122,26,0) 60%),
      radial-gradient(80% 26% at 4% 34%, rgba(124,58,237,.20) 0%, rgba(124,58,237,0) 60%),
      radial-gradient(70% 24% at 96% 66%, rgba(217,70,239,.12) 0%, rgba(217,70,239,0) 60%),
      #050507; background-color:#050507; min-height:100vh; }
  .banner { position:relative; overflow:hidden; margin:16px 16px 0; border-radius:28px; padding:28px 20px 24px; text-align:center; color:#fff;
    background:
      radial-gradient(130% 95% at 88% -12%, rgba(255,214,120,.85) 0%, rgba(255,214,120,0) 52%),
      radial-gradient(120% 110% at 4% 112%, rgba(94,92,230,.75) 0%, rgba(94,92,230,0) 55%),
      radial-gradient(90% 80% at 96% 88%, rgba(255,55,95,.5) 0%, rgba(255,55,95,0) 55%),
      linear-gradient(138deg,#ff9f0a 0%,#ff5f3d 42%,#e8387a 78%,#a24fe0 115%);
    box-shadow:0 22px 44px rgba(232,56,122,.36), 0 6px 18px rgba(255,95,61,.28), inset 0 1px 0 rgba(255,255,255,.4); }
  .banner::after { content:""; position:absolute; left:0; right:0; top:0; height:48%; background:linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0)); pointer-events:none; }
  .crown { position:relative; z-index:1; width:56px; height:56px; margin:0 auto 10px; background:rgba(255,255,255,.20); border:1px solid rgba(255,255,255,.55); border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 22px rgba(160,40,90,.32), inset 0 1px 0 rgba(255,255,255,.55); }
  .banner h1 { position:relative; z-index:1; font-size:19.5px; letter-spacing:1.5px; font-weight:800; text-shadow:0 2px 12px rgba(150,20,80,.4); }
  .banner p { position:relative; z-index:1; margin-top:7px; font-size:12.5px; letter-spacing:2px; font-weight:500; opacity:.95; }
  .main { padding:18px 16px 4px; }
  .intro { text-align:center; font-size:13px; color:rgba(235,235,245,.62); font-weight:500; line-height:1.7; }
  .intro b { color:#ffb340; }
  h2 { font-size:16px; font-weight:800; letter-spacing:-.2px; margin:20px 2px 11px; color:#fff; }
  h2 span { background:linear-gradient(92deg,#ffb340,#ff5f3d); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .acct-note { margin-top:14px; background:rgba(255,159,10,.10); border:.5px solid rgba(255,159,10,.35); color:rgba(235,235,245,.85); border-radius:16px; padding:11px 14px; font-size:13px; line-height:1.6; text-align:center; }
  .acct-note b { color:#ffb340; }
  .box { background:rgba(255,255,255,.055); border:.5px solid rgba(255,255,255,.09); border-radius:20px; padding:8px 15px; box-shadow:0 10px 24px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.06); }
  .box li { list-style:none; font-size:13px; padding:8px 0; color:rgba(235,235,245,.78); border-bottom:.5px solid rgba(255,255,255,.07); }
  .box li:last-child { border-bottom:none; }
  .box li::before { content:"✓"; color:#ffb340; font-weight:800; margin-right:8px; }
  .steps { font-size:12.5px; color:rgba(235,235,245,.68); line-height:2.05; padding:12px 15px; }
  .steps b { color:#ffb340; }
  .pay-note { display:flex; align-items:center; gap:8px; margin-top:14px; background:rgba(22,119,255,.12); border:.5px solid rgba(22,119,255,.4); color:rgba(219,234,254,.9); border-radius:14px; padding:10px 12px; font-size:12px; line-height:1.55; }
  .pay-note .ali { background:#1677ff; color:#fff; font-weight:800; border-radius:5px; padding:1px 7px; font-size:12px; white-space:nowrap; flex:none; box-shadow:0 4px 10px rgba(22,119,255,.4); }
  .err { display:none; margin-top:12px; background:rgba(220,38,38,.14); border:.5px solid rgba(248,113,113,.45); color:#fca5a5; border-radius:14px; padding:10px 12px; font-size:12.5px; line-height:1.6; }
  .loading { text-align:center; color:rgba(235,235,245,.45); font-size:13px; padding:16px 0; }
  footer { text-align:center; color:rgba(235,235,245,.3); font-size:11px; line-height:1.9; padding:18px 10px 24px; }

  .amounts { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  .amt { background:rgba(255,255,255,.055); border:.5px solid rgba(255,255,255,.10); border-radius:20px; padding:17px 10px 14px; text-align:center; cursor:pointer; box-shadow:0 10px 24px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.07); }
  .amt.sel { border:1.5px solid transparent; background:linear-gradient(rgba(38,24,20,.94), rgba(38,24,20,.94)) padding-box, linear-gradient(135deg,#ffb340,#ff5f3d,#e8387a) border-box; box-shadow:0 12px 30px rgba(255,95,61,.30), inset 0 1px 0 rgba(255,255,255,.08); }
  .amt .v { font-size:24px; font-weight:800; color:#fff; line-height:1.15; }
  .amt .v small { font-size:13px; color:rgba(235,235,245,.5); font-weight:500; }
  .amt.sel .v { background:linear-gradient(92deg,#ffb340,#ff6a3d); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .amt .d { font-size:11.5px; color:rgba(235,235,245,.5); margin-top:4px; }
  .paybtn { display:block; width:100%; margin-top:17px; background:linear-gradient(92deg,#ff9f0a,#ff5f3d 55%,#e8387a); color:#fff; border:none; border-radius:16px; padding:14px 0; font-size:16px; font-weight:700; letter-spacing:1px; cursor:pointer; box-shadow:0 14px 30px rgba(232,56,122,.38), inset 0 1px 0 rgba(255,255,255,.35); }
  .paybtn:disabled { opacity:.55; }
</style>
</head>
<body>
  <div class="banner">
    <div class="crown">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-1.6 10H4.6L3 8z" fill="#fff" opacity="0.95"/><rect x="4.6" y="19" width="14.8" height="1.8" rx="0.9" fill="#fff" opacity="0.95"/></svg>
    </div>
    <h1>黑湾代驾MAX · 钱包充值</h1>
    <p>服务短信余额充值</p>
  </div>

  <div class="main">
    <p class="intro">余额用于行程开始/完成时<b>自动给乘客发送服务短信</b><br>每条 <span id="smsPrice">0.15</span> 元，从余额中扣除，发送失败自动退款</p>

    <div class="acct-note">充值后自动到账您 <b>App 登录的账号</b>，无需填写手机号</div>

    <h2>选择 <span>充值金额</span></h2>
    <div class="amounts" id="amtList"><p class="loading">档位加载中…</p></div>

    <button class="paybtn" id="payBtn" type="button">立即充值</button>
    <div class="err" id="errBox"></div>

    <h2>使用 <span>说明</span></h2>
    <ul class="box">
      <li>服务短信为会员专享：行程开始与完成时自动通知乘客</li>
      <li>每条短信按实际发送从余额扣除，发送失败自动退款</li>
      <li>余额以服务端为准，可在 App「我的账户」随时查看</li>
      <li>充值后实时到账，无需联系客服</li>
    </ul>

    <div class="pay-note"><span class="ali">支付宝</span> 本页面通过支付宝安全支付，付款成功后系统自动入账。</div>
  </div>


<script>
  var errBox = document.getElementById('errBox');
  var payBtn = document.getElementById('payBtn');
  var selectedAmount = 0;
  var qs = new URLSearchParams(location.search);
  var entryToken = qs.get('t') || '';

  function showErr(msg) {
    errBox.textContent = msg;
    errBox.style.display = 'block';
    errBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function hideErr() { errBox.style.display = 'none'; }
  function fmtPrice(p) {
    return (Math.round(p * 100) / 100).toString().replace(/\.0+$/, '').replace(/(\.\d)0$/, '$1');
  }

  function renderAmounts(amounts, smsPriceCents) {
    if (smsPriceCents) document.getElementById('smsPrice').textContent = fmtPrice(smsPriceCents / 100);
    var list = document.getElementById('amtList');
    list.innerHTML = '';
    amounts.forEach(function (a, i) {
      var div = document.createElement('div');
      div.className = 'amt' + (i === 0 ? ' sel' : '');
      var approx = smsPriceCents ? '约可发 ' + Math.floor((a * 100) / smsPriceCents) + ' 条短信' : '';
      div.innerHTML = '<div class="v"><small>¥</small>' + fmtPrice(a) + '</div><div class="d">' + approx + '</div>';
      div.addEventListener('click', function () {
        selectedAmount = a;
        list.querySelectorAll('.amt').forEach(function (el) { el.classList.remove('sel'); });
        div.classList.add('sel');
        payBtn.textContent = '立即充值 ¥' + fmtPrice(a);
      });
      if (i === 0) { selectedAmount = a; payBtn.textContent = '立即充值 ¥' + fmtPrice(a); }
      list.appendChild(div);
    });
  }

  payBtn.addEventListener('click', function () {
    hideErr();
    if (!entryToken) {
      showErr('请在 App 内登录后，从 App 打开本页充值；充值后自动到账您登录的账号。');
      return;
    }
    if (!selectedAmount) { showErr('请选择充值金额'); return; }
    payBtn.disabled = true;
    payBtn.textContent = '处理中…';
    fetch('/api/pay/alipay/create-wap-recharge-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: entryToken, amount: selectedAmount })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.ok && j.outTradeNo) {
        location.href = '/pay?o=' + encodeURIComponent(j.outTradeNo);
      } else {
        showErr((j && j.error) || '下单失败，请稍后重试');
        payBtn.disabled = false;
        payBtn.textContent = '立即充值 ¥' + fmtPrice(selectedAmount);
      }
    }).catch(function () {
      showErr('网络异常，请稍后重试');
      payBtn.disabled = false;
      payBtn.textContent = '立即充值 ¥' + fmtPrice(selectedAmount);
    });
  });

  fetch('/api/shop/wallet-config').then(function (r) { return r.json(); }).then(function (j) {
    if (j && j.ok && Array.isArray(j.rechargeAmounts) && j.rechargeAmounts.length) renderAmounts(j.rechargeAmounts, Number(j.smsPriceCents) || 0);
    else document.getElementById('amtList').innerHTML = '<p class="loading">档位加载失败，请刷新重试</p>';
  }).catch(function () {
    document.getElementById('amtList').innerHTML = '<p class="loading">档位加载失败，请刷新重试</p>';
  });
</script>
</body>
</html>
