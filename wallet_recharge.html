<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黑湾代驾MAX · 钱包充值</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#f4f6f9; color:#1a1c1c; max-width:430px; margin:0 auto; }
  .banner { background:linear-gradient(135deg,#ff8a3d 0%,#f4633a 60%,#e0483e 100%); color:#fff; text-align:center; padding:28px 20px 24px; }
  .crown { width:54px; height:54px; margin:0 auto 9px; background:rgba(255,255,255,.18); border:1.5px solid rgba(255,255,255,.55); border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .banner h1 { font-size:20px; letter-spacing:2px; font-weight:800; text-shadow:0 1px 3px rgba(0,0,0,.18); }
  .banner p { margin-top:7px; font-size:12.5px; letter-spacing:1px; opacity:.92; }
  .main { padding:18px 16px 4px; }
  .intro { text-align:center; font-size:13px; color:#584235; font-weight:500; line-height:1.65; }
  .intro b { color:#e0483e; }
  h2 { font-size:15.5px; font-weight:800; margin:18px 2px 10px; }
  h2 span { color:#f4633a; }
  .acct-note { background:#fff7f3; border:1px solid #ffd9c7; color:#9a3412; border-radius:13px; padding:11px 14px; font-size:13px; line-height:1.6; text-align:center; box-shadow:0 1px 3px rgba(16,24,40,.05); }
  .acct-note b { color:#e0483e; }
  .amounts { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .amt { background:#fff; border:1.5px solid #e5e7eb; border-radius:13px; padding:16px 10px; text-align:center; cursor:pointer; box-shadow:0 1px 3px rgba(16,24,40,.05); }
  .amt.sel { border-color:#f4633a; background:#fff7f3; }
  .amt .v { font-size:22px; font-weight:800; color:#e0483e; }
  .amt .v small { font-size:12px; color:#8a94a6; font-weight:400; }
  .amt .d { font-size:11.5px; color:#8a94a6; margin-top:4px; }
  .paybtn { display:block; width:100%; margin-top:16px; background:linear-gradient(135deg,#ff8a3d,#f4633a); color:#fff; border:none; border-radius:24px; padding:13px 0; font-size:16px; font-weight:800; letter-spacing:1px; cursor:pointer; }
  .paybtn:disabled { opacity:.55; }
  .box { background:#fff; border:1px solid #e5e7eb; border-radius:13px; padding:12px 14px; box-shadow:0 1px 3px rgba(16,24,40,.05); }
  .box li { list-style:none; font-size:13px; padding:5.5px 0; color:#374151; border-bottom:1px dashed #e5e7eb; }
  .box li:last-child { border-bottom:none; }
  .box li::before { content:"✓"; color:#f4633a; font-weight:800; margin-right:8px; }
  .pay-note { display:flex; align-items:center; gap:8px; margin-top:14px; background:#eff6ff; border:1px solid #bfdbfe; color:#1e40af; border-radius:11px; padding:9px 12px; font-size:12px; line-height:1.55; }
  .pay-note .ali { background:#1677ff; color:#fff; font-weight:800; border-radius:5px; padding:1px 7px; font-size:12px; white-space:nowrap; flex:none; }
  .err { display:none; margin-top:12px; background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; border-radius:11px; padding:9px 12px; font-size:12.5px; line-height:1.6; }
  .loading { text-align:center; color:#8a94a6; font-size:13px; padding:16px 0; }
  footer { text-align:center; color:#9ca3af; font-size:11px; line-height:1.9; padding:18px 10px 24px; }
</style>
</head>
<body>
  <div class="banner">
    <div class="crown">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-1.6 10H4.6L3 8z" fill="#fff" opacity="0.95"/><rect x="4.6" y="19" width="14.8" height="1.8" rx="0.9" fill="#fff" opacity="0.95"/></svg>
    </div>
    <h1>黑湾代驾MAX · 钱包充值</h1>
    <p>服务短信余额充值</p>
  </div>

  <div class="main">
    <p class="intro">余额用于行程开始/完成时<b>自动给乘客发送服务短信</b><br>每条 <span id="smsPrice">0.15</span> 元，从余额中扣除，发送失败自动退款</p>

    <div class="acct-note">充值后自动到账您 <b>App 登录的账号</b>，无需填写手机号</div>

    <h2>选择 <span>充值金额</span></h2>
    <div class="amounts" id="amtList"><p class="loading">档位加载中…</p></div>

    <button class="paybtn" id="payBtn" type="button">立即充值</button>
    <div class="err" id="errBox"></div>

    <h2>使用 <span>说明</span></h2>
    <ul class="box">
      <li>服务短信为会员专享：行程开始与完成时自动通知乘客</li>
      <li>每条短信按实际发送从余额扣除，发送失败自动退款</li>
      <li>余额以服务端为准，可在 App「我的账户」随时查看</li>
      <li>充值后实时到账，无需联系客服</li>
    </ul>

    <div class="pay-note"><span class="ali">支付宝</span> 本页面通过支付宝安全支付，付款成功后系统自动入账。</div>
  </div>


<script>
  var errBox = document.getElementById('errBox');
  var payBtn = document.getElementById('payBtn');
  var selectedAmount = 0;
  var qs = new URLSearchParams(location.search);
  var entryToken = qs.get('t') || '';

  function showErr(msg) {
    errBox.textContent = msg;
    errBox.style.display = 'block';
    errBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function hideErr() { errBox.style.display = 'none'; }
  function fmtPrice(p) {
    return (Math.round(p * 100) / 100).toString().replace(/\.0+$/, '').replace(/(\.\d)0$/, '$1');
  }

  function renderAmounts(amounts, smsPriceCents) {
    if (smsPriceCents) document.getElementById('smsPrice').textContent = fmtPrice(smsPriceCents / 100);
    var list = document.getElementById('amtList');
    list.innerHTML = '';
    amounts.forEach(function (a, i) {
      var div = document.createElement('div');
      div.className = 'amt' + (i === 0 ? ' sel' : '');
      var approx = smsPriceCents ? '约可发 ' + Math.floor((a * 100) / smsPriceCents) + ' 条短信' : '';
      div.innerHTML = '<div class="v"><small>¥</small>' + fmtPrice(a) + '</div><div class="d">' + approx + '</div>';
      div.addEventListener('click', function () {
        selectedAmount = a;
        list.querySelectorAll('.amt').forEach(function (el) { el.classList.remove('sel'); });
        div.classList.add('sel');
        payBtn.textContent = '立即充值 ¥' + fmtPrice(a);
      });
      if (i === 0) { selectedAmount = a; payBtn.textContent = '立即充值 ¥' + fmtPrice(a); }
      list.appendChild(div);
    });
  }

  payBtn.addEventListener('click', function () {
    hideErr();
    if (!entryToken) {
      showErr('请在 App 内登录后，从 App 打开本页充值；充值后自动到账您登录的账号。');
      return;
    }
    if (!selectedAmount) { showErr('请选择充值金额'); return; }
    payBtn.disabled = true;
    payBtn.textContent = '处理中…';
    fetch('/api/pay/alipay/create-wap-recharge-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: entryToken, amount: selectedAmount })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.ok && j.outTradeNo) {
        location.href = '/pay?o=' + encodeURIComponent(j.outTradeNo);
      } else {
        showErr((j && j.error) || '下单失败，请稍后重试');
        payBtn.disabled = false;
        payBtn.textContent = '立即充值 ¥' + fmtPrice(selectedAmount);
      }
    }).catch(function () {
      showErr('网络异常，请稍后重试');
      payBtn.disabled = false;
      payBtn.textContent = '立即充值 ¥' + fmtPrice(selectedAmount);
    });
  });

  fetch('/api/shop/wallet-config').then(function (r) { return r.json(); }).then(function (j) {
    if (j && j.ok && Array.isArray(j.rechargeAmounts) && j.rechargeAmounts.length) renderAmounts(j.rechargeAmounts, Number(j.smsPriceCents) || 0);
    else document.getElementById('amtList').innerHTML = '<p class="loading">档位加载失败，请刷新重试</p>';
  }).catch(function () {
    document.getElementById('amtList').innerHTML = '<p class="loading">档位加载失败，请刷新重试</p>';
  });
</script>
</body>
</html>
