<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黑湾代驾MAX · 确认支付</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#f4f6f9; color:#1a1c1c; max-width:430px; margin:0 auto; }
  .banner { background:linear-gradient(135deg,#ff8a3d 0%,#f4633a 60%,#e0483e 100%); color:#fff; text-align:center; padding:22px 20px 18px; }
  .crown { width:44px; height:44px; margin:0 auto 7px; background:rgba(255,255,255,.18); border:1.5px solid rgba(255,255,255,.55); border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .banner h1 { font-size:18px; letter-spacing:2px; font-weight:800; text-shadow:0 1px 3px rgba(0,0,0,.18); }
  .banner p { margin-top:5px; font-size:12px; letter-spacing:1px; opacity:.92; }
  .main { padding:16px 16px 4px; }
  .card { background:#fff; border:1px solid #e5e7eb; border-radius:13px; padding:14px; box-shadow:0 1px 3px rgba(16,24,40,.05); margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; align-items:center; font-size:13.5px; padding:6px 0; color:#374151; }
  .row + .row { border-top:1px dashed #eef1f4; }
  .row .k { color:#8a94a6; }
  .row .v { font-weight:600; color:#1e293b; }
  .amount { text-align:center; padding:14px 0 6px; }
  .amount .label { font-size:12.5px; color:#8a94a6; }
  .amount .num { font-size:34px; font-weight:800; color:#e0483e; margin-top:2px; }
  .amount .num small { font-size:16px; }
  h2 { font-size:15.5px; font-weight:800; margin:16px 2px 10px; }
  h2 span { color:#f4633a; }
  .payway { display:flex; align-items:center; gap:10px; }
  .payway .ali { background:#1677ff; color:#fff; font-weight:800; border-radius:6px; padding:3px 9px; font-size:13px; white-space:nowrap; flex:none; }
  .payway .t { flex:1; }
  .payway .t .n { font-size:14.5px; font-weight:700; color:#1e293b; }
  .payway .t .d { font-size:11.5px; color:#8a94a6; margin-top:2px; }
  .check { width:20px; height:20px; border-radius:50%; background:#f4633a; color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex:none; }
  .paybtn { display:block; width:100%; margin-top:16px; background:linear-gradient(135deg,#ff8a3d,#f4633a); color:#fff; border:none; border-radius:24px; padding:13px 0; font-size:16px; font-weight:800; letter-spacing:1px; cursor:pointer; }
  .paybtn:disabled { opacity:.55; }
  .note { margin-top:12px; font-size:12px; color:#6b7280; line-height:1.8; text-align:center; }
  .note b { color:#e0483e; }
  .safe { display:flex; align-items:center; justify-content:center; gap:6px; margin-top:10px; font-size:11.5px; color:#9ca3af; padding-bottom:22px; }
  .err { display:none; margin-top:12px; background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; border-radius:11px; padding:9px 12px; font-size:12.5px; line-height:1.6; text-align:center; }
  .success { text-align:center; padding:26px 14px 20px; }
  .success .ico { width:58px; height:58px; margin:0 auto 12px; border-radius:50%; background:#16a34a; color:#fff; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; }
  .success .t1 { font-size:17px; font-weight:800; color:#1e293b; }
  .success .t2 { font-size:13px; color:#6b7280; margin-top:8px; line-height:1.8; }
  .success .t2 b { color:#16a34a; }
  .hidden { display:none; }
  .loading { text-align:center; color:#8a94a6; font-size:13px; padding:30px 0; }
</style>
</head>
<body>
  <div class="banner">
    <div class="crown">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-1.6 10H4.6L3 8z" fill="#fff" opacity="0.95"/><rect x="4.6" y="19" width="14.8" height="1.8" rx="0.9" fill="#fff" opacity="0.95"/></svg>
    </div>
    <h1>确认支付</h1>
    <p id="bannerSub">黑湾代驾MAX · 会员购买</p>
  </div>

  <div class="main">
    <p class="loading" id="loading">订单加载中…</p>

    <div id="payArea" class="hidden">
      <div class="card">
        <div class="row"><span class="k">商品</span><span class="v" id="rPkg">—</span></div>
        <div class="row"><span class="k">购买账号</span><span class="v" id="rPhone">—</span></div>
        <div class="row"><span class="k">订单号</span><span class="v" id="rOrder">—</span></div>
        <div class="amount">
          <div class="label">应付金额</div>
          <div class="num"><small>¥</small><span id="rAmount">—</span></div>
        </div>
      </div>

      <h2>支付 <span>方式</span></h2>
      <div class="card">
        <div class="payway">
          <span class="ali">支付宝</span>
          <div class="t"><div class="n">支付宝支付</div><div class="d" id="paywayDesc">推荐使用，付款后自动开通会员</div></div>
          <span class="check">✓</span>
        </div>
      </div>

      <button class="paybtn" id="payBtn" type="button">确认支付</button>
      <div class="err" id="errBox"></div>

      <p class="note" id="payNote">点击「确认支付」将跳转支付宝完成付款<br>付款成功后<b>会员自动开通、实时生效</b>，有效期顺延<br>请确认购买账号无误，会员将开通到该账号</p>
    </div>

    <div id="paidArea" class="hidden">
      <div class="card success">
        <div class="ico">✓</div>
        <div class="t1" id="paidTitle">支付成功，会员已开通</div>
        <p class="t2" id="paidInfo">会员已自动开通生效，回到 App 即可使用。</p>
      </div>
    </div>
  </div>

<script>
  var qs = new URLSearchParams(location.search);
  var outTradeNo = qs.get('o') || '';
  var errBox = document.getElementById('errBox');
  var payBtn = document.getElementById('payBtn');
  var pollTimer = null;

  function showErr(msg) { errBox.textContent = msg; errBox.style.display = 'block'; }
  function fmtAmount(a) { return Number(a).toFixed(2); }
  function pkgName(o) {
    if (o.orderType === 'wallet') return '短信余额充值';
    if (Number(o.days) === 99999) return '永久会员';
    return Number(o.days) + ' 天会员';
  }

  function applyTypeTexts(o) {
    if (o.orderType !== 'wallet') return;
    document.getElementById('bannerSub').textContent = '黑湾代驾MAX · 钱包充值';
    document.getElementById('paywayDesc').textContent = '推荐使用，付款后余额自动到账';
    document.getElementById('payNote').innerHTML = '点击「确认支付」将跳转支付宝完成付款<br>付款成功后<b>余额自动到账</b>，回到 App 即可使用<br>请确认充值账号无误，余额将充入该账号';
    document.getElementById('paidTitle').textContent = '充值成功，余额已到账';
  }

  function render(o) {
    document.getElementById('loading').classList.add('hidden');
    applyTypeTexts(o);
    if (o.status === 'paid') {
      document.getElementById('payArea').classList.add('hidden');
      document.getElementById('paidArea').classList.remove('hidden');
      var info = '会员已自动开通生效，回到 App 即可使用。';
      if (o.orderType === 'wallet') info = '短信余额已到账，回到 App 即可使用。';
      else if (o.vipExpiryAfter) info = '会员有效期至 <b>' + o.vipExpiryAfter + '</b>，回到 App 即可使用。';
      document.getElementById('paidInfo').innerHTML = info;
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      return;
    }
    document.getElementById('paidArea').classList.add('hidden');
    document.getElementById('payArea').classList.remove('hidden');
    document.getElementById('rPkg').textContent = pkgName(o);
    document.getElementById('rPhone').textContent = o.phoneMasked || '—';
    document.getElementById('rOrder').textContent = o.outTradeNo || '—';
    document.getElementById('rAmount').textContent = fmtAmount(o.amount);
    payBtn.textContent = '确认支付 ¥' + fmtAmount(o.amount);
  }

  function loadOrder() {
    if (!outTradeNo) {
      document.getElementById('loading').textContent = '订单号缺失，请返回购买页重新下单';
      return;
    }
    fetch('/api/pay/wap-order?o=' + encodeURIComponent(outTradeNo))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok) {
          render(j);
          if (j.status !== 'paid' && !pollTimer) {
            pollTimer = setInterval(loadOrder, 3000);
          }
        } else {
          document.getElementById('loading').textContent = (j && j.error) || '订单不存在';
        }
      })
      .catch(function () {
        document.getElementById('loading').textContent = '网络异常，请刷新重试';
      });
  }

  payBtn.addEventListener('click', function () {
    errBox.style.display = 'none';
    payBtn.disabled = true;
    payBtn.textContent = '正在跳转支付宝…';
    fetch('/api/pay/alipay/wap-pay', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ outTradeNo: outTradeNo })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.ok && j.payUrl) {
        location.href = j.payUrl;
      } else if (j && j.ok && j.status === 'paid') {
        loadOrder();
      } else {
        showErr((j && j.error) || '组装支付链接失败，请稍后重试');
        payBtn.disabled = false;
        loadOrder();
      }
    }).catch(function () {
      showErr('网络异常，请稍后重试');
      payBtn.disabled = false;
      loadOrder();
    });
  });

  loadOrder();
</script>
</body>
</html>
