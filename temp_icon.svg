<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)" />
  
  <!-- Outer Gold Ring with subtle glow -->
  <circle cx="512" cy="512" r="380" fill="none" stroke="url(#gold)" stroke-width="16" opacity="0.9" filter="url(#glow)" />
  <circle cx="512" cy="512" r="350" fill="url(#badge)" stroke="url(#gold)" stroke-width="4" />

  <!-- Shield / Speed Symbol -->
  <path d="M 512 240 L 680 320 C 680 500 512 660 512 720 C 512 660 344 500 344 320 Z" fill="url(#gold)" opacity="0.15" />

  <!-- Stylized Steering Wheel / Driver Crest -->
  <circle cx="512" cy="470" r="160" fill="none" stroke="url(#gold)" stroke-width="28" />
  <circle cx="512" cy="470" r="52" fill="url(#gold)" />
  <!-- Spokes -->
  <line x1="512" y1="470" x2="512" y2="630" stroke="url(#gold)" stroke-width="26" stroke-linecap="round" />
  <line x1="512" y1="470" x2="360" y2="420" stroke="url(#gold)" stroke-width="26" stroke-linecap="round" />
  <line x1="512" y1="470" x2="664" y2="420" stroke="url(#gold)" stroke-width="26" stroke-linecap="round" />

  <!-- Brand Typography -->
  <text x="512" y="770" font-family="sans-serif" font-weight="900" font-size="80" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">黑湾代驾</text>
  <text x="512" y="840" font-family="sans-serif" font-weight="800" font-size="42" fill="url(#gold)" text-anchor="middle" letter-spacing="12">MAX DRIVER</text>
</svg>