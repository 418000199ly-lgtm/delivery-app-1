<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/hwdjtb.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>黑湾代驾 MAX</title>
    <script>
      // Android System Font Size & Display Zoom Immunity Engine (Neutralizes system font/display scaling)
      (function() {
        if (typeof window === 'undefined') return;

        // 1. WeChat / QQ Browser / Android WebView Font Size Lock
        function lockWeChatFontSize() {
          if (typeof WeixinJSBridge === 'object' && typeof WeixinJSBridge.invoke === 'function') {
            WeixinJSBridge.invoke('setFontSizeCallback', { fontSize: 0 });
            WeixinJSBridge.on('menu:setfont', function() {
              WeixinJSBridge.invoke('setFontSizeCallback', { fontSize: 0 });
            });
          }
        }
        if (typeof WeixinJSBridge === 'object') {
          lockWeChatFontSize();
        } else if (document.addEventListener) {
          document.addEventListener('WeixinJSBridgeReady', lockWeChatFontSize, false);
        }

        // 2. Android WebView / Browser System Font Scaling Normalization
        function normalizeSystemFontScale() {
          try {
            var docEl = document.documentElement;
            // Measure real computed font size compared to target 16px
            var dummy = document.createElement('div');
            dummy.style.cssText = 'font-size:16px!important;width:1rem!important;height:1px!important;position:absolute!important;left:-9999px!important;top:-9999px!important;visibility:hidden!important;pointer-events:none!important;';
            (document.body || docEl).appendChild(dummy);
            var computedSize = parseFloat(window.getComputedStyle(dummy).fontSize || '16');
            (document.body || docEl).removeChild(dummy);

            if (computedSize && Math.abs(computedSize - 16) > 0.05) {
              var scaleFactor = 16 / computedSize;
              docEl.style.setProperty('font-size', (16 * scaleFactor) + 'px', 'important');
              docEl.style.setProperty('--system-font-scale', scaleFactor, 'important');
            } else {
              docEl.style.setProperty('font-size', '16px', 'important');
              docEl.style.setProperty('--system-font-scale', '1', 'important');
            }
          } catch (e) {}
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', normalizeSystemFontScale);
        } else {
          normalizeSystemFontScale();
        }
        window.addEventListener('resize', normalizeSystemFontScale);
        window.addEventListener('pageshow', normalizeSystemFontScale);

        // 3. Disable multi-touch gesture zoom & double-tap zoom
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
